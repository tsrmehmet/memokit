name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x hooks/*.sh hooks/lib/*.sh skills/init/scripts/*.sh
      - name: json manifests
        run: for f in .claude-plugin/*.json hooks/hooks.json schema/*.json examples/*.json; do jq empty "$f"; done
      - name: schema validates example
        run: npx -y ajv-cli@5 validate -s schema/memokit.schema.json -d examples/memokit.json
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - if: runner.os == 'macOS'
        run: brew install bats-core
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: bats (hooks run under /bin/bash; 3.2 on macOS)
        run: /bin/bash --version | head -1 && bats tests/
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
